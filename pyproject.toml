[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fund-lab-v2"
version = "0.1.0"
description = "AI Fund Lab vNext data foundation"
requires-python = ">=3.9"
dependencies = [
  "moomoo-api>=10.7.6708",
  "pandas>=2",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
